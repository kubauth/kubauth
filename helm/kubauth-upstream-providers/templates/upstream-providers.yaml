

# This is preserved from a discarded helm implementation, to be used as base for kubauth package

{{ range .Values.upstreamProviders }}

{{ $name := .name}}

{{- if .clientSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: upstream-{{ $name }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
  clientSecret: "{{ .clientSecret }}"
{{- end }}


---
apiVersion: kubauth.kubotal.io/v1alpha1
kind: UpstreamProvider
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  enabled: {{ .enabled }}
  type: {{ .type }}
  displayName: {{ .displayName }}
  {{ with .clientSpecific }}clientSpecific: {{ . }}{{ end }}
  {{ with .issuerURL }}issuerURL: {{ .}}{{- end }}
  {{- with .certificateAuthority }}
  certificateAuthority:
    {{- with .configMap }}
    configMap:
      name: {{ .name }}
      key: {{ .key }}
    {{- end }}
    {{- with .secret }}
    secret:
      name: {{ .name }}
      key: {{ .key }}
    {{- end }}
  {{- end }}
  {{ with .insecureSkipVerify }}insecureSkipVerify: {{ . }}{{ end }}
  {{ with .redirectURL }}redirectURL: {{ .}}{{ end }}
  {{ with .clientId }}clientId: {{ .}}{{ end }}
  {{- with .clientSecret }}
  clientSecret:
    name: upstream-{{ $name }}
    key: clientSecret
  {{- end }}
  {{- with .clientSecretRef }}
  clientSecret:
    name: {{ .name}}
    key: {{ .key }}
  {{- end }}
  {{- with .scopes }}
  scopes:
    {{- range . }}
    - {{ . }}
    {{- end }}
  {{- end }}
  {{ with .useUserInfo }}useUserInfo: {{ . }}{{ end }}
  {{- with .claimRenamings }}
  claimRenamings:
  {{- range . }}
    - oldName: {{ .oldName }}
      newName: {{ .newName }}
      {{ with .operation }}operation: {{ . }}{{- end }}
  {{- end }}
  {{- end }}
  {{- with .claimRemovals }}
  claimRemovals:
  {{- range . }}
    - {{ . }}
  {{- end }}
  {{- end }}
  {{ with .localEnrichment }}localEnrichment: {{ .}}{{ end }}
  {{- with .explicitConfig }}
  explicitConfig:
    {{ with .authorization_endpoint }}authorization_endpoint: {{ .}}{{ end }}
    {{ with .token_endpoint }}token_endpoint: {{ .}}{{ end }}
    {{ with .device_authorization_endpoint }}device_authorization_endpoint: {{ .}}{{ end }}
    {{ with .userinfo_endpoint }}userinfo_endpoint: {{ .}}{{ end }}
    {{ with .jwks_uri }}jwks_uri: {{ .}}{{ end }}
    {{- with .id_token_signing_alg_values_supported }}
    id_token_signing_alg_values_supported:
      {{- range . }}
      - {{ . }}
      {{- end }}
    {{- end }}
    {{ with .introspection_endpoint }}introspection_endpoint: {{ .}}{{ end }}
    {{ with .end_session_endpoint }}end_session_endpoint: {{ .}}{{ end }}
  {{- end}}
  {{ with .dumpExchanges }}dumpExchanges: {{ .}}{{ end }}
{{- end }}
